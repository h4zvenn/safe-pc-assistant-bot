# Folders listed by /files. %VAR% references are expanded; missing folders are skipped.
folders:
  allowed_roots:
    - "%USERPROFILE%/Downloads/BotInbox"
    - "%USERPROFILE%/Desktop/Shared"

limits:
  max_file_size_mb: 50
  allowed_extensions:
    - ".txt"
    - ".log"
    - ".png"
    - ".jpg"
    - ".jpeg"
    - ".zip"
    - ".pdf"

# Folders that "открой загрузки" etc. may open in Explorer (voice, text). Only these, never a free path.
shortcuts:
  downloads:
    name: "Загрузки"
    path: "%USERPROFILE%/Downloads"
    aliases: ["загрузки", "загрузок", "завантаження", "downloads", "папка загрузок"]
  documents:
    name: "Документы"
    path: "%USERPROFILE%/Documents"
    aliases: ["документы", "документи", "documents", "папка документы"]
  pictures:
    name: "Изображения"
    path: "%USERPROFILE%/Pictures"
    aliases: ["изображения", "картинки", "зображення", "pictures", "фото"]
  videos:
    name: "Видео"
    path: "%USERPROFILE%/Videos"
    aliases: ["видео", "відео", "videos", "папка видео"]
  music:
    name: "Музыка"
    path: "%USERPROFILE%/Music"
    aliases: ["папка музыка", "папка с музыкой", "папка музика"]
