# Scenarios are fixed lists of registered steps. Allowed step types:
#   open_app (app: <app id from apps.yaml>), health_check, ping_check [host],
#   show_heavy_apps, set_volume (level: 0..100), mute_volume
# require_confirmation: true = Telegram/local confirmation before running.
# aliases: spoken names for the voice / text modes.
scenarios:
  gaming:
    description: "Gaming"
    aliases: ["игровой режим", "игровий режим", "ігровий режим", "режим игры", "режим гри", "gaming", "game mode"]
    require_confirmation: false
    steps:
      - type: "health_check"
      - type: "ping_check"
      - type: "open_app"
        app: "steam"
      - type: "open_app"
        app: "discord"

  stream:
    description: "Streaming"
    aliases: ["стрим", "режим стрима", "режим стріму", "streaming"]
    require_confirmation: false
    steps:
      - type: "open_app"
        app: "obs"
      - type: "open_app"
        app: "discord"
      - type: "open_app"
        app: "chrome"

  night:
    description: "Night mode"
    aliases: ["ночной режим", "нічний режим", "night mode"]
    require_confirmation: false
    steps:
      - type: "open_app"
        app: "spotify"

  work:
    description: "Work"
    aliases: ["рабочий режим", "робочий режим", "work mode"]
    require_confirmation: true
    steps:
      - type: "open_app"
        app: "chrome"

  afk:
    description: "AFK"
    aliases: ["афк", "режим афк", "afk"]
    require_confirmation: true
    steps:
      - type: "show_heavy_apps"
